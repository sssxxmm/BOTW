
name: 0-Check (BotW)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check macOS and Xcode
        run: |
          df -h /
          sw_vers
          xcodebuild -version

      - name: Cleanup
        run: |
          sudo rm -rf /Users/runner/Library/Android || true
          sudo rm -rf /Library/Developer/CoreSimulator || true
          df -h /

      - name: Check disk usage
        run: |
          du -sh /Applications/Xcode*.app 2>/dev/null || true
          du -sh /Users/runner/hostedtoolcache 2>/dev/null || true
          du -sh /Users/runner/Library/Caches 2>/dev/null || true
          ls /Applications | head -50

      - name: Check keys secret
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          if [ -z "$PROD_KEYS" ]; then
            echo "PROD_KEYS secret is missing"
            exit 1
          fi
          echo "PROD_KEYS secret is configured"

      - name: Check Google Drive configuration
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then
            echo "RCLONE_CONF secret is missing"
            exit 1
          fi

          brew install rclone
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes
