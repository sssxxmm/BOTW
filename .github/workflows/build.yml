name: Build Switch IPA
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "prepare = 셰이더까지(오래 걸림) / pack = IPA 만들기"
        type: choice
        options: [prepare, pack]
        default: pack

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 350
    steps:
    - name: Free Disk Space
      run: |
        sudo rm -rf /Users/runner/Library/Android || true
        sudo rm -rf /Library/Developer/CoreSimulator || true
        df -h /

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        brew install xcodegen zstd glslang rclone
        brew install --cask dotnet-sdk
        python3 -m pip install --upgrade pip
        python3 -m pip install lz4 capstone fonttools "backports.zstd" nsz

    - name: Setup Rclone Config
      env:
        RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      run: |
        mkdir -p ~/.config/rclone
        printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

    - name: Download Game Files
      run: |
        mkdir -p ~/Games
        rclone copy "gdrive:젤다 야숨/" ~/Games/ -P --include "*.xci" --include "*.nsp"
        ls -lh ~/Games

    - name: Restore cache from Drive (pack only)
      if: inputs.stage == 'pack'
      run: |
        rclone cat "gdrive:SwitchGames/cache/BotW_Build.tar" | tar -C ~/Games -xf -
        ls ~/Games
        df -h /

    - name: Clone nxnative (pinned)
      run: |
        git clone https://github.com/seedds/nxnative.git
        cd nxnative
        git checkout $(git rev-list -n 1 --before="2026-10-28T03:00:00Z" HEAD)
        git log -1 --format='%H %cd'

    - name: Setup prod.keys
      env:
        PROD_KEYS: ${{ secrets.PROD_KEYS }}
      run: |
        mkdir -p ~/keys
        printf '%s\n' "$PROD_KEYS" > ~/keys/prod.keys

    - name: Stage 1 - prepare (shaders)
      if: inputs.stage == 'prepare'
      env:
        ALLOW_OTHER_METAL: "True"
      run: |
        cd nxnative
        python3 scripts/build_ipa_from_nsp.py ~/Games -k ~/keys/prod.keys --prepare-xcode --allow-other-metal

    - name: Stage 1 - save cache to Drive
      if: inputs.stage == 'prepare'
      run: |
        df -h /
        ls ~/Games
        tar -C ~/Games -cf - $(cd ~/Games && ls -d *_build) \
          | rclone rcat "gdrive:SwitchGames/cache/BotW_Build.tar" \
              --drive-chunk-size 256M --tpslimit 5 -P

    - name: Stage 2 - pack IPA
      if: inputs.stage == 'pack'
      env:
        ALLOW_OTHER_METAL: "True"
        PYTHONUNBUFFERED: "1"
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
      run: |
        monitor() {
          while true; do
            echo "=== MONITOR $(date) ==="
            df -h / | tail -1
            vm_stat | head -4
            ps -axo rss,comm | sort -nr | head -3
            sleep 120
          done
        }
        monitor & MON=$!
        trap "kill $MON 2>/dev/null" EXIT

        cd nxnative

        for i in 1 2 3; do
          echo "=== BUILD ATTEMPT $i ==="
          find ~/Games -path '*_build/*' -name '*.tmp-*' -delete 2>/devnull || true
          if python3 scripts/build_ipa_from_nsp.py ~/Games -k ~/keys/prod.keys -o ~/Games/BotW.ipa --allow-other-metal; then
            break
          fi
          echo "attempt $i failed"
          df -h /
          if [ "$i" = 3 ]; then exit 1; fi
        done

    - name: Stage 2 - upload IPA to Drive
      if: inputs.stage == 'pack'
      run: rclone copy ~/Games/BotW.ipa "gdrive:SwitchGames/output" --retries 10 --low-level-retries 20 --tpslimit 5 -P
