name: Build Switch IPA
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "prepare = 셰이더까지(오래 걸림) / pack = IPA 만들기"
        type: choice
        options: [prepare, pack]
        default: prepare

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 350
    steps:
    - name: Free Disk Space
      run: |
        sudo rm -rf /Users/runner/Library/Android || true
        sudo rm -rf /Library/Developer/CoreSimulator || true
        df -h /

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        brew install xcodegen zstd glslang rclone
        brew install --cask dotnet-sdk
        python3 -m pip install --upgrade pip
        python3 -m pip install lz4 capstone fonttools "backports.zstd" nsz

    - name: Setup Rclone Config
      env:
        RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      run: |
        mkdir -p ~/.config/rclone
        printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

    - name: Download Game Files
      run: |
        mkdir -p ~/Games
        rclone copy "gdrive:젤다 야숨/" ~/Games/ -P --include "*.xci" --include "*.nsp"
        ls -lh ~/Games

    - name: Restore cache from Drive (pack only)
      if: inputs.stage == 'pack'
      run: |
        rclone cat "gdrive:SwitchGames/cache/build.tar" | tar -C ~/Games
